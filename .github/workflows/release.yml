name: Release

# Builds Limo in Release mode and publishes a portable Linux artifact.
#
# Triggers:
#   - push of a tag matching v*  -> build + upload artifact + create a GitHub
#     Release with the AppImage (and tarball) attached.
#   - workflow_dispatch          -> build + upload artifact only (no Release),
#     handy for testing the packaging without cutting a tag.
#
# The build mirrors .github/workflows/ci.yml (same deps, same cmake flags,
# LOOT/UNRAR off, cpr built from a pinned tag). On top of the CI build it runs
# `cmake --install` into a staging prefix and wraps the result in an AppImage
# via linuxdeploy + its Qt plugin. If AppImage tooling were to fail, the tarball
# fallback step still produces a usable archive of the staged install tree.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  # Needed by softprops/action-gh-release to create/update the Release.
  contents: write

env:
  # Pin cpr to an immutable commit SHA rather than a mutable tag (fork audit F092; same as CI).
  # This is the commit the 1.14.2 release tag points to.
  CPR_REF: "f091b2c061b307ee89b164c39976fc9202a1c79d" # cpr 1.14.2
  CPR_PREFIX: "/tmp/cpr-prefix"
  # Where `cmake --install` stages the app before it is turned into an AppImage.
  STAGE_DIR: "/tmp/limo-appdir"

jobs:
  release:
    name: Build AppImage (Qt6, LOOT/UNRAR off)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # --- Dependencies (mirrors ci.yml) ----------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++-14 pkg-config git \
            qt6-base-dev qt6-base-dev-tools libqt6svg6-dev \
            libjsoncpp-dev libarchive-dev libpugixml-dev libssl-dev \
            liblz4-dev libzstd-dev zlib1g-dev libcurl4-openssl-dev \
            file desktop-file-utils libfuse2t64 wget

      # Cache the built+installed cpr prefix, keyed on the pinned ref and runner
      # image. A cache hit skips the clone/configure/build/install below.
      - name: Cache cpr prefix
        id: cache-cpr
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CPR_PREFIX }}
          key: cpr-${{ runner.os }}-ubuntu-24.04-gxx14-${{ env.CPR_REF }}

      - name: Build and install cpr from source
        if: steps.cache-cpr.outputs.cache-hit != 'true'
        run: |
          # Fetch the pinned commit directly (a SHA cannot be used with --branch).
          git init /tmp/cpr
          git -C /tmp/cpr remote add origin https://github.com/libcpr/cpr
          git -C /tmp/cpr fetch --depth 1 origin "$CPR_REF"
          git -C /tmp/cpr checkout --detach FETCH_HEAD
          cmake -S /tmp/cpr -B /tmp/cpr/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCPR_USE_SYSTEM_CURL=ON -DCPR_BUILD_TESTS=OFF \
            -DBUILD_SHARED_LIBS=ON -DCMAKE_INSTALL_PREFIX="$CPR_PREFIX"
          cmake --build /tmp/cpr/build --target install

      # --- Configure & build (mirrors ci.yml) -----------------------------
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DLIMO_WITH_LOOT=OFF \
            -DLIMO_WITH_UNRAR=OFF \
            -DBUILD_TESTING=OFF \
            -DCMAKE_PREFIX_PATH="$CPR_PREFIX"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # --- Stage the install tree -----------------------------------------
      # Install into a usr-prefixed AppDir layout that linuxdeploy understands.
      # CMakeLists installs the binary as `bin/limo` plus the .desktop, icon,
      # steam_app_configs/ and changelogs.json under share/.
      - name: Install into AppDir
        run: |
          rm -rf "$STAGE_DIR"
          DESTDIR="$STAGE_DIR" cmake --install build --prefix /usr
          echo "Staged tree:"
          find "$STAGE_DIR" -maxdepth 4 -print

      # --- Determine version ----------------------------------------------
      # On a tag push use the tag (without leading v); otherwise use the short
      # SHA so dispatch builds get a sensible, unique name.
      - name: Determine version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building artifacts for version: $VERSION"

      # --- AppImage packaging ---------------------------------------------
      # linuxdeploy bundles the ELF + its non-system libraries; the Qt plugin
      # pulls in the needed Qt6 plugins/libs so the result runs on other distros.
      - name: Download linuxdeploy
        env:
          # Pin to a specific, immutable release tag instead of the rolling
          # 'continuous' tag so builds are reproducible and the artifacts can be
          # checksum-verified against the upstream-published .sha256 files.
          LINUXDEPLOY_TAG: "1-alpha-20240109-1"
          LINUXDEPLOY_QT_TAG: "1-alpha-20240109-1"
        run: |
          set -euo pipefail
          cd /tmp

          base_ld="https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_TAG}"
          base_qt="https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/${LINUXDEPLOY_QT_TAG}"

          # Download each binary together with its upstream SHA256 sidecar and
          # verify before making it executable. Abort the build on any mismatch.
          for spec in \
            "${base_ld}|linuxdeploy-x86_64.AppImage" \
            "${base_qt}|linuxdeploy-plugin-qt-x86_64.AppImage"; do
            base="${spec%%|*}"
            file="${spec##*|}"
            wget -q "${base}/${file}"
            wget -q "${base}/${file}.sha256"
            # Some releases publish the checksum with the original download path
            # as the filename; normalise it to the local filename before -c.
            sha256sum -c <(awk -v f="${file}" '{print $1 "  " f}' "${file}.sha256")
            chmod +x "${file}"
          done

      - name: Build AppImage
        id: appimage
        # Don't fail the whole job if AppImage generation hiccups; the tarball
        # fallback below still produces a usable artifact.
        continue-on-error: true
        env:
          # qmake6 lets the Qt plugin locate the Qt6 installation.
          QMAKE: /usr/bin/qmake6
          # Embed the version in the generated AppImage filename.
          LINUXDEPLOY_OUTPUT_VERSION: ${{ steps.version.outputs.version }}
          OUTPUT: Limo-${{ steps.version.outputs.version }}-x86_64.AppImage
        run: |
          /tmp/linuxdeploy-x86_64.AppImage \
            --appdir "$STAGE_DIR" \
            --plugin qt \
            --desktop-file "$STAGE_DIR/usr/share/applications/limo.desktop" \
            --icon-file "$STAGE_DIR/usr/share/icons/hicolor/512x512/apps/limo.png" \
            --output appimage
          # linuxdeploy writes the AppImage into the current dir; surface its path.
          APPIMAGE="$(ls -1 *.AppImage | head -n1)"
          echo "Produced AppImage: $APPIMAGE"
          echo "appimage_path=$APPIMAGE" >> "$GITHUB_OUTPUT"

      # --- Tarball fallback / supplement ----------------------------------
      # Always produced: a plain archive of the staged install tree. Acts as the
      # fallback if the AppImage step failed, and is a handy extra otherwise.
      - name: Create tarball
        run: |
          TARBALL="Limo-${{ steps.version.outputs.version }}-x86_64.tar.gz"
          tar -czf "$TARBALL" -C "$STAGE_DIR" usr
          echo "Produced tarball: $TARBALL"
          ls -lh "$TARBALL"

      # --- Verify the AppImage was actually produced ----------------------
      # The AppImage step is allowed to fail (continue-on-error) so the tarball
      # still uploads as a workflow artifact for debugging. But a *Release* must
      # not silently degrade to tarball-only, so record whether a usable
      # AppImage exists and surface a warning annotation when it does not.
      - name: Check AppImage presence
        id: check_appimage
        run: |
          set -euo pipefail
          if [ "${{ steps.appimage.outcome }}" = "success" ] && ls -1 *.AppImage >/dev/null 2>&1; then
            echo "appimage_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "appimage_ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=AppImage missing::AppImage build did not produce an artifact (step outcome: ${{ steps.appimage.outcome }}); a GitHub Release will not be published from this run."
          fi

      # --- Upload as workflow artifact (always) ---------------------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: limo-${{ steps.version.outputs.version }}
          path: |
            *.AppImage
            Limo-*-x86_64.tar.gz
          if-no-files-found: error

      # --- Fail tag releases that lack an AppImage ------------------------
      # On a tag push the AppImage is a required release asset; if it is missing
      # fail the run loudly rather than publishing a tarball-only Release.
      - name: Require AppImage for tag releases
        if: github.ref_type == 'tag' && steps.check_appimage.outputs.appimage_ok != 'true'
        run: |
          echo "::error title=Release blocked::No AppImage was produced for tag ${{ github.ref_name }}; refusing to publish a tarball-only Release."
          exit 1

      # --- Attach to a GitHub Release (tag pushes only) -------------------
      - name: Publish GitHub Release
        if: github.ref_type == 'tag' && steps.check_appimage.outputs.appimage_ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # Drafts a release for the pushed tag and uploads the assets.
          tag_name: ${{ github.ref_name }}
          name: Limo ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            *.AppImage
            Limo-*-x86_64.tar.gz
