name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build and run CTest
        run: |
          nix build --no-link --print-build-logs --impure --expr '
            let
              nixpkgs = builtins.getFlake "github:NixOS/nixpkgs/11cb3517b3af6af300dd6c055aeda73c9bf52c48";
              pkgs = import nixpkgs {
                system = "x86_64-linux";
                config.allowUnfree = true;
              };
            in (pkgs.limo.override { withUnrar = true; }).overrideAttrs (old: {
              src = ./.;
              buildInputs = old.buildInputs ++ (with pkgs; [ openssl lz4 zstd zlib catch2_3 ]);
              cmakeFlags = old.cmakeFlags ++ [ "-DBUILD_TESTING=ON" ];
              doCheck = true;
              checkPhase = "ctest --parallel 1 --output-on-failure --no-tests=error";
            })
          '
