name: Build

on:
  push:
    branches: [ dev, main ]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes / PR updates).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin cpr to an immutable commit SHA rather than a mutable tag (fork audit F092). This is the
  # commit the 1.14.2 release tag points to; using the SHA prevents a moved/retagged release from
  # silently changing the built dependency.
  CPR_REF: "f091b2c061b307ee89b164c39976fc9202a1c79d" # cpr 1.14.2
  CPR_PREFIX: "/tmp/cpr-prefix"

jobs:
  build:
    name: Build (Qt6, LOOT/UNRAR off)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++-14 pkg-config git \
            qt6-base-dev qt6-base-dev-tools libqt6svg6-dev \
            libjsoncpp-dev libarchive-dev libpugixml-dev libssl-dev \
            liblz4-dev libzstd-dev zlib1g-dev libcurl4-openssl-dev

      # Cache the built+installed cpr prefix, keyed on the pinned ref and runner
      # image. A cache hit skips the clone/configure/build/install below.
      - name: Cache cpr prefix
        id: cache-cpr
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CPR_PREFIX }}
          key: cpr-${{ runner.os }}-ubuntu-24.04-gxx14-${{ env.CPR_REF }}

      - name: Build and install cpr from source
        if: steps.cache-cpr.outputs.cache-hit != 'true'
        run: |
          # Fetch the pinned commit directly (a SHA cannot be used with --branch).
          git init /tmp/cpr
          git -C /tmp/cpr remote add origin https://github.com/libcpr/cpr
          git -C /tmp/cpr fetch --depth 1 origin "$CPR_REF"
          git -C /tmp/cpr checkout --detach FETCH_HEAD
          cmake -S /tmp/cpr -B /tmp/cpr/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCPR_USE_SYSTEM_CURL=ON -DCPR_BUILD_TESTS=OFF \
            -DBUILD_SHARED_LIBS=ON -DCMAKE_INSTALL_PREFIX="$CPR_PREFIX"
          cmake --build /tmp/cpr/build --target install

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DLIMO_WITH_LOOT=OFF \
            -DLIMO_WITH_UNRAR=OFF \
            -DBUILD_TESTING=OFF \
            -DCMAKE_PREFIX_PATH="$CPR_PREFIX"

      - name: Build
        run: cmake --build build -j"$(nproc)"

  # Build the test suite (LOOT off, so no libloot dependency) and run ctest.
  # Blocking: the suite passes with LOOT off, so a test regression gates merges.
  test:
    name: Tests (ctest, LOOT off)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++-14 pkg-config git \
            qt6-base-dev qt6-base-dev-tools libqt6svg6-dev \
            libjsoncpp-dev libarchive-dev libpugixml-dev libssl-dev \
            liblz4-dev libzstd-dev zlib1g-dev libcurl4-openssl-dev \
            catch2

      - name: Cache cpr prefix
        id: cache-cpr
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CPR_PREFIX }}
          key: cpr-${{ runner.os }}-ubuntu-24.04-gxx14-${{ env.CPR_REF }}

      - name: Build and install cpr from source
        if: steps.cache-cpr.outputs.cache-hit != 'true'
        run: |
          # Fetch the pinned commit directly (a SHA cannot be used with --branch).
          git init /tmp/cpr
          git -C /tmp/cpr remote add origin https://github.com/libcpr/cpr
          git -C /tmp/cpr fetch --depth 1 origin "$CPR_REF"
          git -C /tmp/cpr checkout --detach FETCH_HEAD
          cmake -S /tmp/cpr -B /tmp/cpr/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCPR_USE_SYSTEM_CURL=ON -DCPR_BUILD_TESTS=OFF \
            -DBUILD_SHARED_LIBS=ON -DCMAKE_INSTALL_PREFIX="$CPR_PREFIX"
          cmake --build /tmp/cpr/build --target install

      - name: Configure (tests on, LOOT off)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DLIMO_WITH_LOOT=OFF \
            -DLIMO_WITH_UNRAR=OFF \
            -DBUILD_TESTING=ON \
            -DCMAKE_PREFIX_PATH="$CPR_PREFIX"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure --no-tests=error
